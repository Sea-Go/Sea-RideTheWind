Name: knowledge-api
Host: 127.0.0.1
Port: 8186
Mode: dev
Timeout: 120000
MaxBytes: 16777216
Log:
  Mode: console
  Level: info
Observability:
  Version: ${KNOWLEDGE_SERVICE_VERSION}
  LogQueueSize: 512
  QueueSize: 512
  SampleRatio: 1
  ShutdownTimeoutMillis: 3000
Auth:
  AccessSecret: ${KNOWLEDGE_AUTH_SECRET}
  AccessExpire: 3600
UserAuth:
  AccessSecret: ${USER_AUTH_SECRET}
UserRpc:
  Etcd:
    Hosts:
      - ${USER_RPC_ETCD_HOST}
    Key: user.rpc
SearchSummary:
  Endpoint: ${BTW_SEARCH_SUMMARY_ENDPOINT}
  ScopeKey: ${BTW_SEARCH_SCOPE_KEY}
  FastTimeoutMillis: 30000
  DetailedTimeoutMillis: 90000
  AllowPartial: false
  AllowLowerIntelligence: false
# Enable after migrate-tool-search.sql and the BTW Tools consumer are deployed.
SearchTools:
  Endpoint: ""
  ScopeKey: ""
  FastTimeoutMillis: 30000
  DetailedTimeoutMillis: 90000
  AllowPartial: false
  AllowLowerIntelligence: false
# Enable only after migrate-search-judgments.sql and an approved human rubric.
SearchJudgments:
  Enabled: false
AdministratorIDs:
  - ${KNOWLEDGE_ADMIN_ID}
WorkerToken: ${KNOWLEDGE_WORKER_TOKEN}
Postgres:
  DSN: ${KNOWLEDGE_POSTGRES_DSN}
  MaxConnections: 8
  Migrate: false
Objects:
  Backend: local
  LocalDirectory: ${KNOWLEDGE_OBJECT_DIRECTORY}
