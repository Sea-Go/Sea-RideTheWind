name: go
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # sea-guards 为仓内 replace 依赖（go.mod => ./sea-guards）。仓已迁自建
      # GitLab（GitHub 上已删），CI 经 Cloudflare 入口用只读 PAT 拉取。
      - name: Checkout sea-guards (self-hosted GitLab)
        run: git clone --depth 1 "https://${{ secrets.GITLAB_GUARDS_USER }}:${{ secrets.GITLAB_GUARDS_TOKEN }}@gitlab-cf.sea-ridethewindbreakthewaves.xyz/whalehall/sea-guards.git" sea-guards
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
